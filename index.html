<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloom</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="logo">🌻 BLOOM</div>
    <p>昨日より、一歩前へ。</p>
  </header>

  <main>

    <section class="hero">
      <p class="small">TODAY</p>
      <h1>おかえり、あすぃに。</h1>
      <p>今日も自分のために、ひとつ積み重ねよう。</p>
    </section>

    <section class="card">
      <h2>🔥 今日のミッション</h2>

      <label>
        <input type="checkbox">
        <span>運動する</span>
      </label>

      <label>
        <input type="checkbox">
        <span>勉強する</span>
      </label>

      <label>
        <input type="checkbox">
        <span>水分をとる</span>
      </label>

      <label>
        <input type="checkbox">
        <span>ストレッチする</span>
      </label>
    </section>

    <section class="card coach">
      <div class="coach-title">
        <span>💛</span>
        <h2>COACH</h2>
      </div>

      <p>
        「完璧じゃなくていい。<br>
        昨日の自分より、一歩前へ。」
      </p>
    </section>

    <section class="card">
      <h2>💪 TRAINING</h2>
      <p>今日も少しずつ、自分を強く。</p>

      <button onclick="location.href='#'">
        トレーニングを見る →
      </button>
    </section>

    <section class="card">
      <h2>📚 STUDY</h2>
      <p>未来の自分のために、今日も積み重ね。</p>

      <button onclick="location.href='#'">
        勉強を始める →
      </button>
    </section>

  </main>

  <footer>
    <p>🌻 BLOOM</p>
    <small>Grow every day.</small>
  </footer>

</body>
</html>
