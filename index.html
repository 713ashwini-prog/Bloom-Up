<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloom-Up 🌻</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <div class="logo">🌻 BLOOM-UP</div>
  <p>昨日より、一歩前へ。</p>
</header>

<!-- HOME画面 -->
<main id="home-page">

  <section class="hero">
    <p class="small">TODAY</p>
    <h1>おかえり、あすぃに。</h1>
    <p>今日も自分のために、ひとつ積み重ねよう。</p>
  </section>

  <section class="card training-card">
    <p class="section-label">💪 TRAINING</p>
    <h2>今日のトレーニング</h2>
    <p id="home-training-description">
      今日のおすすめメニューをチェック！
    </p>

    <button class="main-button" onclick="openTraining()">
      トレーニングを見る →
    </button>
  </section>

  <section class="card">

    <p class="section-label">🔥 TODAY'S MISSION</p>

    <h2>今日のミッション</h2>

    <label class="mission">
      <input type="checkbox">
      <span>運動する</span>
    </label>

    <label class="mission">
      <input type="checkbox">
      <span>勉強する</span>
    </label>

    <label class="mission">
      <input type="checkbox">
      <span>水分をとる</span>
    </label>

    <label class="mission">
      <input type="checkbox">
      <span>ストレッチする</span>
    </label>

    <p id="mission-message" class="mission-message">
      今日も一歩ずつ🌻
    </p>

  </section>

  <section class="card coach">

    <p class="section-label">💛 COACH</p>

    <h2>今日の一言</h2>

    <p class="coach-message">
      「完璧じゃなくていい。<br>
      昨日の自分より、一歩前へ。」
    </p>

  </section>

</main>


<!-- TRAINING画面 -->
<main id="training-page" class="hidden">

  <button class="back-button" onclick="closeTraining()">
    ← HOMEに戻る
  </button>

  <section class="hero training-hero">

    <p class="small">TODAY'S TRAINING</p>

    <h1 id="training-day"></h1>

    <p id="training-description"></p>

  </section>

  <section id="video-list"></section>

</main>


<footer>
  <strong>🌻 BLOOM-UP</strong>
  <p>Grow stronger every day.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
